[project]
name = "puddle-jump"
version = "0.1.0"
description = "A simple stock trading application driven by news and price momentum."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[project.scripts]
puddle-jump = "puddle_jump.main:main"
show-daily-watchlist = "puddle_jump.daily_watchlist.show_daily_watchlist:main"
show-strategy-settings = "puddle_jump.strategy_settings.show_strategy_settings:main"
show-stock-pool = "puddle_jump.stock_pool.show_stock_pool:main"

[dependency-groups]
dev = [
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
